name: Staging Continuous Deployment

# Continuously deploy main to the staging instance (testnet) through the
# standard time-locked proposal flow, verify with health + canary checks, and
# roll back automatically on failure. See docs/staging-deployment.md and
# issue #1236.
#
# Triggers:
#   • workflow_run — after "Contract CI" succeeds on main. This is the
#     required-checks gate: only merges that passed CI deploy. Direct pushes
#     that skipped CI never satisfy this gate.
#   • schedule — hourly follow-up that completes a pending execution once the
#     on-chain upgrade delay has elapsed (the time-lock is a security
#     property and is never skipped in this workflow).
#   • workflow_dispatch — manual rehearsal (supports dry_run=true).
#
# Safety:
#   • concurrency group `staging-deploy` with cancel-in-progress:false —
#     deployments serialize; a merge during a deployment queues behind it.
#   • Staging CD never targets mainnet (scripts fail closed on any other alias).
#   • The staging signing key is staging-only, held in the `staging`
#     GitHub Environment (required reviewers + main-only branch policy).

on:
  workflow_run:
    workflows: ["Contract CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print commands without executing (rehearsal)"
        required: false
        default: "false"
      commit:
        description: "Commit SHA to deploy (default: main HEAD)"
        required: false
        default: ""

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STELLAR_CLI_VERSION: "21.0.0"
  STAGING_NETWORK: "testnet"

jobs:
  # ── Gate: only CI-verified main commits deploy ──────────────────────────
  gate:
    name: Deployment gate (required checks)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - name: Resolve deploy commit
        id: resolve
        run: |
          SHOULD_DEPLOY=true
          DEPLOY_SHA=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Triggering CI run: conclusion=$CONCLUSION branch=$HEAD_BRANCH sha=$HEAD_SHA"
            if [ "$CONCLUSION" != "success" ] || [ "$HEAD_BRANCH" != "main" ]; then
              echo "Gate closed: CI did not succeed on main (conclusion=$CONCLUSION, branch=$HEAD_BRANCH). Skipping deploy."
              SHOULD_DEPLOY=false
            else
              DEPLOY_SHA="$HEAD_SHA"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled follow-up run: will complete a pending execution if one exists."
            DEPLOY_SHA="main"
          else
            echo "Manual dispatch (dry_run=${{ inputs.dry_run }}, commit=${{ inputs.commit }})."
            if [ -n "${{ inputs.commit }}" ]; then
              DEPLOY_SHA="${{ inputs.commit }}"
            else
              DEPLOY_SHA="main"
            fi
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build, upgrade staging, verify, rollback on failure
    needs: [gate]
    # Belt and suspenders with the gate job: the workflow_run guard below
    # restates the required-checks rule (CI success on main) as a workflow
    # expression so the policy is visible at the job level and enforced even
    # if the gate outputs are ever refactored.
    if: >-
      needs.gate.outputs.should_deploy == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
      issues: write
      actions: read
    outputs:
      staging_status: ${{ steps.upgrade.outputs.staging_status }}
    steps:
      - name: Checkout deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Pin Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release -p ledgerlens-score --locked

      - name: Optimize WASM
        run: |
          RAW_WASM=target/wasm32-unknown-unknown/release/ledgerlens_score.wasm
          OPT_WASM=target/wasm32-unknown-unknown/release/ledgerlens_score.optimized.wasm
          stellar contract optimize --wasm "$RAW_WASM" --output "$OPT_WASM"
          sha256sum "$OPT_WASM" > target/ledgerlens_score.optimized.wasm.sha256
          cat target/ledgerlens_score.optimized.wasm.sha256

      - name: Configure staging signing key (staging-only, environment-scoped)
        env:
          STAGING_SOROBAN_SECRET_KEY: ${{ secrets.STAGING_SOROBAN_SECRET_KEY }}
        run: |
          if [ -z "${STAGING_SOROBAN_SECRET_KEY:-}" ]; then
            echo "ERROR: STAGING_SOROBAN_SECRET_KEY is not configured in the 'staging' environment." >&2
            echo "See docs/staging-deployment.md § Secrets scope and rotation." >&2
            exit 1
          fi
          printf '%s' "$STAGING_SOROBAN_SECRET_KEY" | stellar keys import staging-deployer --overwrite
          echo "Staging identity configured: $(stellar keys address staging-deployer)"
          echo "Contract: ${{ secrets.STAGING_CONTRACT_ID }} on $STAGING_NETWORK"

      - name: Fetch previous staging WASM (rollback source)
        id: prev_wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p target/staging-prev
          PREV="target/staging-prev/ledgerlens_score.previous.wasm"
          # Most recent successful staging run carries the last verified artifact.
          RUN_ID=$(gh run list --workflow staging-deploy.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$RUN_ID" ]; then
            echo "Latest successful staging run: $RUN_ID"
            if gh run download "$RUN_ID" -n staging-deployment-evidence -D target/staging-prev 2>/dev/null; then
              CANDIDATE=$(find target/staging-prev -name '*.optimized.wasm' | head -n 1 || true)
              if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
                mv "$CANDIDATE" "$PREV"
                echo "Previous staging WASM: $PREV ($(sha256sum "$PREV" | awk '{print $1}'))"
                echo "prev_wasm_path=$PREV" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "No prior staging evidence found — first deployment will run without rollback coverage."
          echo "prev_wasm_path=" >> "$GITHUB_OUTPUT"

      - name: Upgrade staging through the standard proposal flow
        id: upgrade
        env:
          GITHUB_SHA: ${{ needs.gate.outputs.deploy_sha }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGING_CONTRACT_ID: ${{ secrets.STAGING_CONTRACT_ID }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          PREV_FLAG="--allow-no-rollback"
          if [ -n "${{ steps.prev_wasm.outputs.prev_wasm_path }}" ]; then
            PREV_FLAG="--previous-wasm ${{ steps.prev_wasm.outputs.prev_wasm_path }}"
          fi
          chmod +x scripts/staging-upgrade.sh scripts/rollback.sh scripts/health_check.sh scripts/verify-deployment.sh
          set +e
          # shellcheck disable=SC2086
          bash scripts/staging-upgrade.sh --non-interactive $DRY_FLAG $PREV_FLAG \
            "$STAGING_NETWORK" staging-deployer "$STAGING_CONTRACT_ID" \
            target/wasm32-unknown-unknown/release/ledgerlens_score.optimized.wasm
          CODE=$?
          set -e
          echo "staging-upgrade exit code: $CODE"
          if [ -f deploy/staging.json ]; then
            STATUS=$(python3 -c "import json;print(json.load(open('deploy/staging.json')).get('status','unknown'))")
            echo "staging_status=$STATUS" >> "$GITHUB_OUTPUT"
          fi
          # Exit 2 = proposal recorded, awaiting the time-lock window: not a failure.
          if [ "$CODE" -eq 2 ]; then
            echo "Upgrade proposed; execution awaits the on-chain delay window. Scheduled follow-ups will complete it."
            exit 0
          fi
          exit "$CODE"

      - name: Finalize staging status (never leave pending)
        if: always()
        env:
          UPGRADE_OUTCOME: ${{ steps.upgrade.outcome }}
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os

          path = "deploy/staging.json"
          with open(path) as f:
              data = json.load(f)

          outcome = os.environ.get("UPGRADE_OUTCOME", "")
          status = data.get("status", "pending")

          # A run that did not finish the upgrade cleanly must never leave the
          # placeholder `pending` status behind: record a terminal status so
          # the failure notice and deploy/staging.json agree.
          if outcome != "success" and status == "pending":
              data["status"] = "failed"
              data["note"] = (
                  "Upgrade step outcome: %s. Staging did not reach verified status; "
                  "manual intervention may be required (see docs/staging-deployment.md § Rollback)."
                  % (outcome or "skipped")
              )
              data["commit"] = os.environ.get("DEPLOY_SHA", "")
              data["run_url"] = os.environ.get("RUN_URL", "")
              with open(path, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
              print("Rewrote staging.json status: pending -> failed (upgrade outcome: %s)" % outcome)
          else:
              print("staging.json status unchanged: %s (upgrade outcome: %s)" % (status, outcome))
          EOF

      - name: Publish staging status file
        if: always()
        run: |
          echo "── deploy/staging.json ──"
          cat deploy/staging.json
          python3 - <<'EOF'
          import json
          with open("deploy/staging.schema.json") as f:
              schema = json.load(f)
          with open("deploy/staging.json") as f:
              data = json.load(f)
          missing = [k for k in schema["required"] if k not in data]
          assert not missing, f"staging.json missing required keys: {missing}"
          assert data["network"] in ("testnet", "futurenet"), "staging must never target mainnet"
          assert data["status"] in schema["properties"]["status"]["enum"]
          assert data["status"] != "pending", "a finished staging run must not leave status=pending"
          print("staging.json schema check passed.")
          EOF

      - name: Commit staging status back ([skip ci])
        if: always()
        run: |
          git config user.name "ledgerlens-staging-bot"
          git config user.email "ledgerlens-staging-bot@users.noreply.github.com"
          git add deploy/staging.json target/staging-evidence/staging-upgrade.log || true
          if git diff --cached --quiet; then
            echo "No staging status changes to commit."
            exit 0
          fi
          STATUS=$(python3 -c "import json;print(json.load(open('deploy/staging.json')).get('status','unknown'))")
          git commit -m "chore(staging): update staging deployment status to $STATUS [skip ci]

          Automated by Staging Continuous Deployment (#1236).
          Commit: ${{ needs.gate.outputs.deploy_sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          [skip ci]"
          git push origin HEAD:main

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-evidence
          path: |
            target/staging-evidence/staging-upgrade.log
            deploy/staging.json
            target/ledgerlens_score.optimized.wasm.sha256
            target/wasm32-unknown-unknown/release/ledgerlens_score.optimized.wasm
          retention-days: 90

      # Runs after "Upload deployment evidence" so the artifact referenced in
      # the issue body is already available on the run.
      - name: Notify maintainers on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ needs.gate.outputs.deploy_sha }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Fallback: if the status file is still the `pending` placeholder
          # (e.g. the upgrade step was skipped or crashed before finalizing),
          # write a terminal `failed` status before notifying so the issue
          # never reports `pending`.
          python3 - <<'EOF'
          import json, os

          path = "deploy/staging.json"
          try:
              with open(path) as f:
                  data = json.load(f)
          except (OSError, ValueError):
              data = {"status": "pending"}

          if data.get("status", "pending") == "pending":
              data["status"] = "failed"
              data["note"] = (
                  "Staging deployment did not reach verified status; the upgrade step "
                  "did not finalize. Manual intervention may be required "
                  "(see docs/staging-deployment.md § Rollback)."
              )
              data["commit"] = os.environ.get("DEPLOY_SHA", "")
              data["run_url"] = os.environ.get("RUN_URL", "")
              with open(path, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")
              print("Fallback: staging.json status rewritten pending -> failed.")
          EOF
          STATUS="$(python3 -c "import json;print(json.load(open('deploy/staging.json')).get('status','unknown'))" 2>/dev/null || echo unknown)"
          NOTE="$(python3 -c "import json;print(json.load(open('deploy/staging.json')).get('note',''))" 2>/dev/null || echo '')"
          BODY="$(cat <<EOF
          ## Staging deployment failed (#1236)

          The continuous staging deployment for main commit \`${{ needs.gate.outputs.deploy_sha }}\` did not reach verified status.

          | Field | Value |
          |---|---|
          | Staging status | \`$STATUS\` |
          | Detail | $NOTE |
          | Network | \`$STAGING_NETWORK\` / \`${{ secrets.STAGING_CONTRACT_ID }}\` |
          | Run (logs + evidence) | $RUN_URL |
          | Evidence artifact | \`staging-deployment-evidence\` on the run above |

          ### What to do

          1. Open the run link, download \`staging-deployment-evidence\`, and read \`staging-upgrade.log\`.
          2. Check \`deploy/staging.json\` for the recorded status: \`rolled-back\` means the previous WASM was restored and re-verified by the health checks; \`failed\` means manual intervention is required (see docs/staging-deployment.md § Rollback).
          3. Do not promote this commit further until staging is green again.

          /cc @LedgerLens/arch-reviewers
          EOF
          )"
          gh issue create --title "Staging deployment failed for ${{ needs.gate.outputs.deploy_sha }}" \
            --body "$BODY" \
            --label "staging,deployment-failure" || \
          gh issue create --title "Staging deployment failed for ${{ needs.gate.outputs.deploy_sha }}" \
            --body "$BODY"
